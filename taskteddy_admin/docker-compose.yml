version: "3.8"

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time — must be reachable from the
        # end user's BROWSER (a public API URL), NOT the internal `backend` host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ${COMPOSE_PROJECT_NAME:-taskteddy}_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-taskteddy}_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-taskteddy}
      REDIS_URL: redis://redis:6379/0
      # Fail-closed: compose refuses to start if these are unset. No insecure defaults.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>=32 chars, stable across restarts)}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 7200
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set (bcrypt hash)}
      # Explicit browser origins — "*" is ignored in production (CORS would be disabled).
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set (comma-separated origins)}
      RATE_LIMIT_ENABLED: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME:-taskteddy}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskteddy}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskteddy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-taskteddy}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: