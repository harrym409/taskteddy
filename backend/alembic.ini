# Alembic configuration for TaskTeddy.
# The database URL is NOT set here — it is resolved at runtime from the app config
# (DATABASE_URL env var) inside alembic/env.py, so there is no secret in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use path-safe slug names in generated revision filenames.
truncate_slug_length = 40
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
