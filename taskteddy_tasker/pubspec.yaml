name: taskteddy_tasker
description: TaskTeddy Tasker App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  image_picker: ^1.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/services/
    - assets/images/banners/
