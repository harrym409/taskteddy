name: taskteddy_customer
description: TaskTeddy Customer App - Book services and post tasks
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.1.0
  http: ^1.1.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  permission_handler: ^11.4.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_blue.png
    - assets/images/logo_wordmark.png
    - assets/images/taskteddy_brand.png
    - assets/images/banners/
    - assets/images/services/
